# Build the image from this checkout instead of pulling the published one
# (docs/DEVELOPMENT.md, "Docker"). Use it together with compose.yaml, either
# on every command:
#
#   docker compose -f compose.yaml -f compose.build.yaml up --build -d
#
# or once in `.env`, after which plain `docker compose up --build -d` builds:
#
#   COMPOSE_FILE=compose.yaml:compose.build.yaml
#
# The build needs a few GB of RAM, and on x86-64 a CPU with AVX: some of the
# build tools crash with "Illegal instruction" without it (for example on the
# Celeron J4125 in a Synology DS720+). The image itself runs without AVX.
services:
  app:
    # A local name, so a build is never mistaken for the published image.
    image: ygo-alpha:local
    build:
      context: .
      dockerfile: Dockerfile
