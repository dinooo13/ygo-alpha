name: Docker

# Builds the image and runs it as a self-hoster would (scripts/docker-smoke.sh),
# natively on amd64 and arm64. Pushes to main and version tags then publish the
# tested images, unchanged, as one multi-arch image to GHCR
# (scripts/docker-publish.sh): main as `latest` and `sha-<short sha>`, a tag
# v1.2.3 as `1.2.3` and `sha-<short sha>`. A commit is published once: a tag on
# a commit main already published gets that image, not its own rebuild. Pull
# requests rehearse the publish against a throwaway local registry and push
# nothing.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Build and smoke test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and smoke test
        env:
          SMOKE_SAVE_IMAGE: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
        run: scripts/docker-smoke.sh

      # Only written when every scenario passed.
      - name: Keep the tested image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 1

  # Pull requests: the same publish steps against a local registry, so a
  # broken publish shows up before the merge.
  publish-rehearsal:
    name: Publish rehearsal (local registry)
    if: github.event_name == 'pull_request'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      # As for a push to main, then for a version tag on that commit, which
      # must reuse the image instead of publishing a second build.
      - name: Publish to the local registry
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          scripts/docker-publish.sh localhost:5000/ygo-alpha "$IMAGES" "sha-${GITHUB_SHA::7}" latest
          scripts/docker-publish.sh localhost:5000/ygo-alpha /nonexistent "sha-${GITHUB_SHA::7}" 1.2.3

  publish:
    name: Publish to GHCR
    # Not on forks: their token can't write this package.
    if: github.event_name == 'push' && github.repository == 'dinooo13/ygo-alpha'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that can write packages.
    permissions:
      contents: read
      packages: write
    # One publish at a time across refs: main and a version tag on the same
    # commit share the staging tags and sha-<short sha>.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    env:
      REPOSITORY: ghcr.io/dinooo13/ygo-alpha
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=${GITHUB_REF_NAME#v}
          else
            tag=latest
          fi
          scripts/docker-publish.sh "$REPOSITORY" "$IMAGES" "sha-${GITHUB_SHA::7}" "$tag"
