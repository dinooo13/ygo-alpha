name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NUXT_BETTER_AUTH_SECRET: ci-test-secret-not-for-production-use-only
  NUXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3300

jobs:
  test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Deploy receive script tests
        run: bash deploy/plesk/receive.test.sh

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm test:e2e

      # AGENTS.md's Verify steps rely on pnpm seed:demo; run it (twice, so the
      # second run proves it's idempotent) against the app test:e2e just built.
      - name: Demo seed against the built app
        env:
          PORT: 3400
          NUXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3400
          NUXT_DB_FILE_PATH: ${{ runner.temp }}/demo/app.db
          NUXT_E2E_SEED_CATALOG: 1
          NUXT_ASSISTANT_PROVIDER: fake
        run: |
          node .output/server/index.mjs > "$RUNNER_TEMP/demo-server.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3400/login && break; sleep 1; done
          pnpm seed:demo || { cat "$RUNNER_TEMP/demo-server.log"; exit 1; }
          pnpm seed:demo | grep 'nothing to do'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
